[project]
name = "polydep"
version = "0.2.0"
description = "Dependency graph and boundary enforcement for Python Polylith workspaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aleksandrs Ulme", email = "aleksandrs.ulme@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/aulme/polydep"
Repository = "https://github.com/aulme/polydep"
Issues = "https://github.com/aulme/polydep/issues"

[project.scripts]
polydep = "polydep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a7",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["sample_project"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["polydep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
