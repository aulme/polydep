name: Publish to PyPI

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set version from tag
        run: sed -i "s/^version = .*/version = \"${{ inputs.tag }}\"/" pyproject.toml
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
